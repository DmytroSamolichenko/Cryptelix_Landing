<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Cryptelix – Join the Waitlist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1a1a1a, #000);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      max-width: 520px;
      width: 100%;
      background: linear-gradient(180deg, #0f0f0f, #080808);
      border: 1px solid rgba(241, 196, 15, 0.25);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.8);
    }

    h1 {
      font-size: 42px;
      line-height: 1.15;
      margin-bottom: 18px;
      color: #f5e7b2;
    }

    p {
      font-size: 16px;
      color: #cfcfcf;
      margin-bottom: 28px;
    }

    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    input[type="email"] {
      flex: 1;
      padding: 16px 18px;
      border-radius: 14px;
      border: 1px solid #2a2a2a;
      background: #0d0d0d;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    input::placeholder {
      color: #777;
    }

    button {
      padding: 16px 24px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #f4d03f, #f1c40f);
      color: #000;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 10px 30px rgba(241, 196, 15, 0.35);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 40px rgba(241, 196, 15, 0.45);
    }

    .success {
      display: none;
      margin-top: 20px;
      padding: 16px 18px;
      background: rgba(241, 196, 15, 0.12);
      border: 1px solid rgba(241, 196, 15, 0.35);
      border-radius: 14px;
      color: #f5e7b2;
      font-size: 15px;
    }

    .footer-text {
      margin-top: 22px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Trade Smarter,<br>Not Harder</h1>

    <p>
      Join the Cryptelix waitlist and get early access to our
      AI-powered crypto assistant when we launch.
    </p>

    <form id="waitlistForm">
      <div class="input-group">
        <input type="email" name="email" placeholder="Enter your email" required />
        <button type="submit">Join</button>
      </div>
    </form>

    <div class="success" id="successMessage">
      ✅ You’re on the waitlist!
      We’ll notify you as soon as Cryptelix is live.
    </div>

    <div class="footer-text">
      No spam. One email when we launch.
    </div>
  </div>

  <script>
    const form = document.getElementById("waitlistForm");
    const success = document.getElementById("successMessage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = form.email.value.trim();
      if (!email) return;

      try {
        await fetch("https://cryptelix.app.n8n.cloud/webhook/8a3786b8-0ce6-4d68-ac6b-6f84a463840e", {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            email: email,
            source: "waitlist",
          }),
        });

        form.style.display = "none";
        success.style.display = "block";
      } catch (error) {
        console.error("Webhook error:", error);
        alert("Something went wrong. Please try again.");
      }
    });
  </script>
</body>

</html>
